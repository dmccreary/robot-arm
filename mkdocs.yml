      - "2. Anatomy of a Robot Arm": chapters/02-anatomy-of-a-robot-arm/index.md
      - "3. Electricity, Power, and Safety Basics": chapters/03-electricity-power-and-safety/index.md
      - "4. Serial and CAN Communication": chapters/04-serial-and-can-communication/index.md
