      - "12. Kinematics: Where Is the Hand and How Do I Get There": chapters/12-kinematics/index.md
      - "13. Logging, Testing, Simulation, and ROS 2": chapters/13-logging-testing-simulation/index.md
      - "14. Cameras, Perception, and Learning from Demonstration": chapters/14-perception-and-learning/index.md
      - "15. AI Agents, Tools, and OpenClaw Skills": chapters/15-agents-and-openclaw-skills/index.md
